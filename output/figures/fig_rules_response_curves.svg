<svg width="680" height="544" viewBox="0 0 680 544" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entry-rate curves with the reachable fee-to-VOT range shaded</title>
<style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .sec { fill: #5F5E5A; }
  .pu-t { fill: #3C3489; } .pu-s { fill: #534AB7; }
  .te-t { fill: #085041; } .te-s { fill: #0F6E56; }
  .co-t { fill: #712B13; } .co-s { fill: #993C1D; }
  .gr-s { fill: #5F5E5A; }
</style>
<rect x="0" y="0" width="680" height="544" fill="#ffffff"/>

<rect x="40" y="40" width="600" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts gr-s" x="340" y="61" text-anchor="middle">Shaded band: fee &#247; VOT values that actually occur at the tested fees (2&#8211;6 NZ$, all incomes).</text>
<text class="ts gr-s" x="340" y="79" text-anchor="middle">Curves to the right of it are extrapolation &#8212; the model never charges enough to get there.</text>

<text class="ts sec" x="618" y="103" text-anchor="end">El Farol switch &#8776; 3.2 &#8212; beyond every agent (max possible 2.7)</text>

<rect x="100" y="108" width="211" height="240" fill="#D3D1C7" opacity="0.35"/>
<line x1="100" y1="108" x2="100" y2="348" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="100" y1="348" x2="620" y2="348" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="100" y1="108" x2="620" y2="108" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="100" y1="228" x2="620" y2="228" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="516" y1="108" x2="516" y2="348" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 4"/>

<text class="ts sec" x="92" y="112" text-anchor="end">1.0</text>
<text class="ts sec" x="92" y="232" text-anchor="end">0.5</text>
<text class="ts sec" x="92" y="352" text-anchor="end">0</text>
<text class="ts sec" x="100" y="366" text-anchor="middle">0</text>
<text class="ts sec" x="230" y="366" text-anchor="middle">1</text>
<text class="ts sec" x="360" y="366" text-anchor="middle">2</text>
<text class="ts sec" x="490" y="366" text-anchor="middle">3</text>
<text class="ts sec" x="620" y="366" text-anchor="middle">4</text>
<text class="ts sec" x="360" y="384" text-anchor="middle">fee &#247; value of time</text>
<text class="ts sec" x="64" y="228" text-anchor="middle" transform="rotate(-90 64 228)">P(enter cordon)</text>

<path d="M100 394 v6 H311 v-6" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="ts sec" x="205" y="414" text-anchor="middle">reachable at tested fees (2&#8211;6 NZ$)</text>

<polyline points="100,222 165,263 230,286 295,299 360,306 425,310 490,313 555,315 620,316" fill="none" stroke="#7F77DD" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="100,125 230,125 360,127 451,145 490,180 516,228 542,276 568,296 620,305" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="100,228 620,228" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="7 5"/>
<polyline points="100,158 165,166 230,196 256,228 295,258 360,283 425,294 490,298 555,300 620,301" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linejoin="round"/>

<line x1="60" y1="436" x2="90" y2="436" stroke="#7F77DD" stroke-width="2.5"/>
<text class="ts sec" x="96" y="440">Exp-Decay</text>
<line x1="176" y1="436" x2="206" y2="436" stroke="#1D9E75" stroke-width="2.5"/>
<text class="ts sec" x="212" y="440">El Farol</text>
<line x1="282" y1="436" x2="312" y2="436" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="7 5"/>
<text class="ts sec" x="318" y="440">Q-Learning, day 1</text>
<line x1="440" y1="436" x2="470" y2="436" stroke="#D85A30" stroke-width="2.5"/>
<text class="ts sec" x="476" y="440">Q-Learning, day 14</text>

<rect x="40" y="458" width="190" height="66" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th pu-t" x="135" y="480" text-anchor="middle">Exp-Decay</text>
<text class="ts pu-s" x="135" y="499" text-anchor="middle">Slope sits inside the band</text>
<text class="ts pu-s" x="135" y="515" text-anchor="middle">&#8212; hence the &#8722;21% effect</text>
<rect x="245" y="458" width="190" height="66" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th te-t" x="340" y="480" text-anchor="middle">El Farol</text>
<text class="ts te-s" x="340" y="499" text-anchor="middle">Flat across the band; its</text>
<text class="ts te-s" x="340" y="515" text-anchor="middle">switch is unreachable &#8594; &#8722;1%</text>
<rect x="450" y="458" width="190" height="66" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th co-t" x="545" y="480" text-anchor="middle">Q-Learning</text>
<text class="ts co-s" x="545" y="499" text-anchor="middle">Learns a slope at the band's</text>
<text class="ts co-s" x="545" y="515" text-anchor="middle">edge; &#949; caps the swing</text>
</svg>
