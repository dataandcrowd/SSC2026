<svg width="680" height="452" viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The three CBD-entry decision rules, each read left to right</title>
<style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .hdr { fill: #5F5E5A; }
  .pu-t { fill: #3C3489; } .pu-s { fill: #534AB7; }
  .te-t { fill: #085041; } .te-s { fill: #0F6E56; }
  .co-t { fill: #712B13; } .co-s { fill: #993C1D; }
  .gr-s { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="452" fill="#ffffff"/>

<text class="ts hdr" x="263" y="62" text-anchor="middle">sees</text>
<text class="ts hdr" x="419" y="62" text-anchor="middle">decides</text>
<text class="ts hdr" x="575" y="62" text-anchor="middle">carries to tomorrow</text>

<rect x="40" y="76" width="130" height="80" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th pu-t" x="105" y="112" text-anchor="middle">Exp-Decay</text>
<text class="ts pu-s" x="105" y="132" text-anchor="middle">memoryless</text>
<line x1="172" y1="116" x2="198" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="76" width="126" height="80" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts pu-s" x="263" y="110" text-anchor="middle">Today's fee,</text>
<text class="ts pu-s" x="263" y="128" text-anchor="middle">own value of time</text>
<line x1="328" y1="116" x2="354" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="356" y="76" width="126" height="80" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts pu-s" x="419" y="102" text-anchor="middle">Enters with</text>
<text class="ts pu-s" x="419" y="120" text-anchor="middle">probability</text>
<text class="ts pu-s" x="419" y="138" text-anchor="middle">exp(&#8722;&#946;&#183;fee/VOT)</text>
<line x1="484" y1="116" x2="510" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512" y="76" width="126" height="80" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts pu-s" x="575" y="110" text-anchor="middle">Nothing.</text>
<text class="ts pu-s" x="575" y="128" text-anchor="middle">No state persists</text>

<rect x="40" y="176" width="130" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th te-t" x="105" y="212" text-anchor="middle">El Farol</text>
<text class="ts te-s" x="105" y="232" text-anchor="middle">expectation-led</text>
<line x1="172" y1="216" x2="198" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="176" width="126" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts te-s" x="263" y="210" text-anchor="middle">Shared congestion</text>
<text class="ts te-s" x="263" y="228" text-anchor="middle">history</text>
<line x1="328" y1="216" x2="354" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="356" y="176" width="126" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts te-s" x="419" y="202" text-anchor="middle">Enters if its</text>
<text class="ts te-s" x="419" y="220" text-anchor="middle">forecast sits</text>
<text class="ts te-s" x="419" y="238" text-anchor="middle">below threshold</text>
<line x1="484" y1="216" x2="510" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512" y="176" width="126" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts te-s" x="575" y="210" text-anchor="middle">Re-scored</text>
<text class="ts te-s" x="575" y="228" text-anchor="middle">predictor weights</text>

<rect x="40" y="276" width="130" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th co-t" x="105" y="312" text-anchor="middle">Q-Learning</text>
<text class="ts co-s" x="105" y="332" text-anchor="middle">reward-led</text>
<line x1="172" y1="316" x2="198" y2="316" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="276" width="126" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts co-s" x="263" y="302" text-anchor="middle">Hour and</text>
<text class="ts co-s" x="263" y="320" text-anchor="middle">congestion as</text>
<text class="ts co-s" x="263" y="338" text-anchor="middle">one of 24 states</text>
<line x1="328" y1="316" x2="354" y2="316" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="356" y="276" width="126" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts co-s" x="419" y="302" text-anchor="middle">Picks best-valued</text>
<text class="ts co-s" x="419" y="320" text-anchor="middle">action, explores</text>
<text class="ts co-s" x="419" y="338" text-anchor="middle">with probability &#949;</text>
<line x1="484" y1="316" x2="510" y2="316" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512" y="276" width="126" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts co-s" x="575" y="302" text-anchor="middle">Updated Q-values</text>
<text class="ts co-s" x="575" y="320" text-anchor="middle">and a smaller &#949;,</text>
<text class="ts co-s" x="575" y="338" text-anchor="middle">fed back tomorrow</text>

<rect x="40" y="376" width="598" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts gr-s" x="339" y="400" text-anchor="middle">All three answer one binary question: enter the priced cordon today?</text>
<text class="ts gr-s" x="339" y="419" text-anchor="middle">In the same order, they produce: a smooth price response &#183; collective swings &#183; gradual learning</text>
</svg>
